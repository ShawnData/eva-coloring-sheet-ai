[project]
name = "eva_coloring_sheet_agent"
version = "0.1.0"
description = "eva-coloring-sheet-agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.108.0,<1.0.0"
]

[project.scripts]
eva_coloring_sheet_agent = "eva_coloring_sheet_agent.main:run"
run_crew = "eva_coloring_sheet_agent.main:run"
train = "eva_coloring_sheet_agent.main:train"
replay = "eva_coloring_sheet_agent.main:replay"
test = "eva_coloring_sheet_agent.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
